[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-energy-kpi-dashboard"
version = "0.1.0"
description = "A simple synthetic factory energy-efficiency KPI dashboard with SQL and Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "qiiuai" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "duckdb>=1.0,<2",
  "streamlit>=1.36,<2",
  "plotly>=5.22,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

